<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Noderunners Radio — Admin</title>
<style>
  body { font-family: monospace; background:#0b0e13; color:#e5e5e5; padding:24px; max-width:700px; margin:0 auto; }
  h1 { color:#f5a623; font-size:16px; letter-spacing:1px; text-transform:uppercase; }
  input { padding:8px; border-radius:4px; border:1px solid #444; background:#11151c; color:#e5e5e5; width:280px; }
  button { padding:8px 14px; border-radius:4px; border:none; background:#f5a623; color:#111; font-weight:bold; cursor:pointer; margin-left:8px; }
  button.danger { background:#c0392b; color:#fff; }
  #status { margin-top:20px; }
  .track { padding:8px 0; border-bottom:1px solid #222; }
  .now { color:#2d7d46; font-weight:bold; }
  #msg { margin-top:10px; color:#999; font-size:13px; }
</style>
</head>
<body>
<h1>Noderunners Radio — Admin</h1>
<div>
  <input id="token" type="password" placeholder="Admin token">
  <button id="saveToken">Save</button>
</div>
<div style="margin-top:12px;">
  <button id="skipBtn">Skip current track</button>
  <button id="flushBtn" class="danger">Flush entire queue</button>
  <button id="refreshBtn">Refresh</button>
</div>
<p id="msg"></p>
<div id="status">Loading...</div>

<script>
(function(){
  var tokenInput = document.getElementById('token');
  var statusEl = document.getElementById('status');
  var msgEl = document.getElementById('msg');

  tokenInput.value = localStorage.getItem('nrAdminToken') || '';

  document.getElementById('saveToken').addEventListener('click', function(){
    localStorage.setItem('nrAdminToken', tokenInput.value.trim());
    msgEl.textContent = 'Token saved.';
    refresh();
  });

  function getToken(){ return localStorage.getItem('nrAdminToken') || ''; }

  function renderTrack(t, cls){
    if (!t) return '<p class="track">(none)</p>';
    return '<p class="track ' + (cls||'') + '">' + t.artist + ' — ' + t.title +
      (t.album ? ' (' + t.album + ')' : '') + (t.status ? ' [' + t.status + ']' : '') + '</p>';
  }

  function refresh(){
    fetch('/api/admin/status?token=' + encodeURIComponent(getToken()))
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if (!res.ok){ statusEl.innerHTML = '<p style="color:#c0392b;">' + (res.d.error || 'error') + '</p>'; return; }
        var html = '<h3>Now playing</h3>' + renderTrack(res.d.now_playing, 'now');
        html += '<h3>Queue (' + res.d.queue.length + ')</h3>';
        if (res.d.queue.length === 0) html += '<p class="track">(empty)</p>';
        res.d.queue.forEach(function(t){ html += renderTrack(t); });
        statusEl.innerHTML = html;
      }).catch(function(){ statusEl.innerHTML = '<p style="color:#c0392b;">Could not reach the API.</p>'; });
  }

  function post(path){
    return fetch(path, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'token=' + encodeURIComponent(getToken())
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); });
  }

  document.getElementById('skipBtn').addEventListener('click', function(){
    post('/api/admin/skip').then(function(res){
      msgEl.textContent = res.d.message || res.d.error;
      msgEl.style.color = res.ok ? '#2d7d46' : '#c0392b';
      refresh();
    });
  });

  document.getElementById('flushBtn').addEventListener('click', function(){
    if (!confirm('Clear the entire jukebox queue?')) return;
    post('/api/admin/flush').then(function(res){
      msgEl.textContent = res.d.message || res.d.error;
      msgEl.style.color = res.ok ? '#2d7d46' : '#c0392b';
      refresh();
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', refresh);

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
